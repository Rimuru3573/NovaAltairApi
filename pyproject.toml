[project]
name = "novaaltairapi"
version = "0.1.0"
description = "Api for products NovaAltair"
readme = "README.md"
authors = [
    { name = "rimuru3573", email = "volokitin11@internet.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "a>=1.0",
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.162.0",
    "py3xui>=0.7.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"


[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]